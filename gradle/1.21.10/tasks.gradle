modLoaderSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-all") {
        group = "multiloader/remote"
        dependsOn(":Common:clean")
        dependsOn(":${projectName}:clean")
        dependsOn(":${projectName}:publishCurseforge")
        dependsOn(":${projectName}:publishModrinth")
        dependsOn(":${projectName}:publishGithub")
    }
}

tasks.register("all-all") {
    group = "multiloader/remote"
    dependsOn(allSubprojects.collect { ":${it}:clean" })
    dependsOn(modLoaderSubprojects.collect { ":${it}:publishCurseforge" })
    dependsOn(modLoaderSubprojects.collect { ":${it}:publishModrinth" })
    dependsOn(modLoaderSubprojects.collect { ":${it}:publishGithub" })
    dependsOn(":sendDiscordWebhook")
}

modLoaderSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-client") {
