def allSubprojects = rootProject.subprojects.name
def modLoaderSubprojects = allSubprojects.findAll { !it.toLowerCase().contains("common") }

allSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-clean") {
        group = "multiloader/build"
        dependsOn(":${projectName}:clean")
    }

}

tasks.register("all-clean") {
    group = "multiloader/build"
    dependsOn(allSubprojects.collect { ":${it}:clean" })
}

allSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-build") {
        group = "multiloader/build"
        dependsOn(":Common:clean")
        dependsOn(":${projectName}:clean")
        dependsOn(":${projectName}:build")
    }
}

tasks.register("all-build") {
    group = "multiloader/build"
    dependsOn(allSubprojects.collect { ":${it}:clean" })
    dependsOn(modLoaderSubprojects.collect { ":${it}:build" })
}

allSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-publish") {
        group = "multiloader/publish"
        dependsOn(":Common:clean")
        dependsOn(":${projectName}:clean")
        dependsOn(":${projectName}:publishMavenJavaPublicationToFuzsModResourcesRepository")
    }
}

tasks.register("all-publish") {
    group = "multiloader/publish"
    dependsOn(allSubprojects.collect { ":${it}:clean" })
    dependsOn(allSubprojects.collect { ":${it}:publishMavenJavaPublicationToFuzsModResourcesRepository" })
}

allSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-sources") {
        group = "multiloader/sources"
        dependsOn(":${projectName}:genSourcesWithVineflower")
    }
}

tasks.register("all-sources") {
