    }
}

tasks.register("all-validate") {
    group = "multiloader/sources"
    dependsOn(allSubprojects.collect { ":${it}:validateAccessWidener" })
}

modLoaderSubprojects.forEach { projectName ->
    tasks.register("${projectName.toLowerCase()}-curseforge") {
